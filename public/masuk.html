<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Sistem Manajemen UMKM</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="/js/vendor/lucide.min.js"></script>
  <script src="/js/tampilan.js"></script>
</head>
<body>
  <main class="wadah sempit">
    <h1>Masuk</h1>
    <p class="keterangan">Masuk dulu sebagai pemilik warung supaya bisa tambah produk dan mencatat penjualan.</p>

    <section class="kartu">
      <form id="form-masuk">
        <label>
          Nama pengguna
          <input type="text" id="nama-pengguna" required maxlength="50" autocomplete="username" placeholder="Contoh: pemilik">
        </label>
        <label>
          Kata sandi
          <input type="password" id="kata-sandi" required autocomplete="current-password" placeholder="Kata sandi pemilik">
        </label>
        <p id="pesan-masuk" class="pesan" hidden></p>
        <div class="baris-tombol">
          <button type="submit" id="tombol-masuk">Masuk</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/masuk.js"></script>
</body>
</html>
